<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover"/>
  <meta name="theme-color" content="#1a1f2e" id="themeColorMeta"/>
  <meta name="mobile-web-app-capable" content="yes"/>
  <meta name="apple-mobile-web-app-capable" content="yes"/>
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
  <meta name="apple-mobile-web-app-title" content="DocuFran"/>
  <title>DocuFran</title>
  <link rel="manifest" href="manifest.json"/>
  <link rel="apple-touch-icon" href="icons/icon-192.png"/>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600&display=swap" rel="stylesheet"/>
  <style>
    :root{
      --gb:rgba(255,255,255,0.07);--gborder:rgba(255,255,255,0.13);--ghover:rgba(255,255,255,0.12);
      --s:#1a1f2e;--s2:#222736;--s3:#2a3045;--s4:#313654;
      --a:#7eb8f7;--a2:#a78bfa;--a3:#6ee7b7;--a4:#fbbf24;
      --tx:#eef0f7;--mu:#8890aa;--dg:#f87171;
      --font:'Outfit',sans-serif;--r:16px;--rsm:10px;
      --orb1:rgba(126,184,247,0.12);--orb2:rgba(167,139,250,0.10);
    }
    .light{
      --gb:rgba(0,0,0,0.04);--gborder:rgba(0,0,0,0.10);--ghover:rgba(0,0,0,0.07);
      --s:#f0f2f8;--s2:#e4e8f2;--s3:#d8ddef;--s4:#ccd3e8;
      --a:#2563eb;--a2:#7c3aed;--a3:#059669;--a4:#d97706;
      --tx:#1a1f2e;--mu:#64748b;--dg:#dc2626;
      --orb1:rgba(37,99,235,0.07);--orb2:rgba(124,58,237,0.06);
    }
    *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
    html,body{height:100%;background:var(--s);color:var(--tx);font-family:var(--font);overscroll-behavior:none;transition:background .3s,color .3s;}
    body::before{content:'';position:fixed;top:-20%;left:-10%;width:60vw;height:60vw;background:radial-gradient(circle,var(--orb1) 0%,transparent 70%);pointer-events:none;z-index:0;}
    body::after{content:'';position:fixed;bottom:-10%;right:-10%;width:50vw;height:50vw;background:radial-gradient(circle,var(--orb2) 0%,transparent 70%);pointer-events:none;z-index:0;}
    #app{position:relative;z-index:1;max-width:900px;margin:0 auto;height:100vh;display:flex;flex-direction:column;padding:env(safe-area-inset-top,0) env(safe-area-inset-right,0) env(safe-area-inset-bottom,0) env(safe-area-inset-left,0);}

    /* HEADER */
    .hdr{padding:12px 16px 8px;display:flex;align-items:center;gap:10px;flex-shrink:0;}
    .logo{width:34px;height:34px;border-radius:10px;background:linear-gradient(135deg,var(--a),var(--a2));display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:700;color:#fff;flex-shrink:0;}
    .hdr-txt{flex:1;min-width:0;}
    .hdr-txt h1{font-size:17px;font-weight:600;letter-spacing:-.3px;display:flex;align-items:baseline;gap:6px;}
    .ver{font-size:10px;font-weight:400;color:var(--mu);}
    .hdr-txt p{font-size:11px;color:var(--mu);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
    .hdr-acts{display:flex;gap:5px;flex-shrink:0;}
    .ibtn{width:32px;height:32px;border-radius:8px;background:var(--gb);border:1px solid var(--gborder);color:var(--mu);cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:16px;transition:background .2s,color .2s;}
    .ibtn:hover,.ibtn.on{background:var(--ghover);color:var(--tx);}
    .ibtn.fav-on{color:var(--a4);}

    /* SEARCH */
    .srch{padding:0 14px 6px;flex-shrink:0;}
    .sbox{display:flex;align-items:center;gap:8px;background:var(--gb);border:1px solid var(--gborder);border-radius:var(--r);padding:0 13px;transition:border-color .2s;}
    .sbox:focus-within{border-color:var(--a);}
    #si{flex:1;background:none;border:none;outline:none;color:var(--tx);font-family:var(--font);font-size:15px;padding:12px 0;}
    #si::placeholder{color:var(--mu);}
    .clr{background:none;border:none;color:var(--mu);cursor:pointer;font-size:15px;padding:3px;display:none;}
    .clr.on{display:flex;}

    /* ACTIVE TAGS BAR */
    .atags{padding:0 14px 4px;flex-shrink:0;display:none;}
    .atags.on{display:flex;gap:5px;overflow-x:auto;scrollbar-width:none;}
    .atags::-webkit-scrollbar{display:none;}
    .atag{display:flex;align-items:center;gap:4px;padding:4px 9px;border-radius:14px;font-size:11px;font-weight:500;cursor:pointer;flex-shrink:0;transition:opacity .2s;}
    .atag.g{background:rgba(126,184,247,0.18);color:var(--a);border:1px solid rgba(126,184,247,0.3);}
    .atag.t{background:rgba(167,139,250,0.18);color:var(--a2);border:1px solid rgba(167,139,250,0.3);}
    .atag.ex{background:rgba(248,113,113,0.15);color:var(--dg);border:1px solid rgba(248,113,113,0.25);}
    .atag.fv{background:rgba(251,191,36,0.18);color:var(--a4);border:1px solid rgba(251,191,36,0.3);}

    /* FILTER PANELS */
    .flt{padding:0 14px 6px;flex-shrink:0;}
    .flt-row{display:flex;gap:6px;margin-bottom:5px;overflow-x:auto;scrollbar-width:none;}
    .flt-row::-webkit-scrollbar{display:none;}
    .fgrp-btn{display:flex;align-items:center;gap:5px;padding:5px 11px;border-radius:18px;border:1px solid var(--gborder);background:var(--gb);color:var(--mu);font-family:var(--font);font-size:12px;font-weight:500;cursor:pointer;white-space:nowrap;flex-shrink:0;transition:all .18s;}
    .fgrp-btn:hover,.fgrp-btn.open{background:var(--ghover);color:var(--tx);}
    .fgrp-btn .cnt{font-size:10px;background:rgba(255,255,255,0.1);border-radius:5px;padding:1px 4px;}
    .light .fgrp-btn .cnt{background:rgba(0,0,0,0.08);}
    .fgrp-btn.has-active{border-color:var(--a);color:var(--a);}
    .fgrp-btn.has-active.therapeutic{border-color:var(--a2);color:var(--a2);}
    .fgrp-btn.has-active.excl{border-color:var(--dg);color:var(--dg);}

    /* DROPDOWN PANEL */
    .fdrop{display:none;background:var(--s2);border:1px solid var(--gborder);border-radius:12px;padding:10px;margin-bottom:6px;flex-wrap:wrap;gap:6px;}
    .fdrop.open{display:flex;}
    .fchip{padding:5px 10px;border-radius:14px;border:1px solid var(--gborder);background:var(--gb);color:var(--mu);font-family:var(--font);font-size:12px;cursor:pointer;white-space:nowrap;transition:all .18s;user-select:none;}
    .fchip:hover{background:var(--ghover);color:var(--tx);}
    .fchip.on{background:rgba(126,184,247,0.18);border-color:var(--a);color:var(--a);}
    .fchip.therapeutic.on{background:rgba(167,139,250,0.18);border-color:var(--a2);color:var(--a2);}
    .fchip.excl.on{background:rgba(248,113,113,0.12);border-color:var(--dg);color:var(--dg);}

    /* STATS */
    .stats{padding:0 18px 6px;font-size:12px;color:var(--mu);flex-shrink:0;}
    .stats span{color:var(--a);font-weight:500;}

    /* RESULTS */
    .res{flex:1;overflow-y:auto;padding:0 14px 20px;scrollbar-width:thin;scrollbar-color:var(--gborder) transparent;}
    .res::-webkit-scrollbar{width:3px;}
    .res::-webkit-scrollbar-thumb{background:var(--gborder);border-radius:2px;}
    .rgrid{display:flex;flex-direction:column;gap:8px;}

    /* CARD */
    .card{background:var(--gb);border:1px solid var(--gborder);border-radius:var(--r);padding:11px 13px;cursor:pointer;transition:background .18s,border-color .18s;display:flex;gap:10px;align-items:flex-start;}
    .card:hover{background:var(--ghover);}
    .card.exp{border-color:rgba(126,184,247,0.35);}
    .card.faved{border-color:rgba(251,191,36,0.35);}
    .ficon{width:36px;height:36px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;flex-shrink:0;}
    .i-pdf{background:rgba(248,113,113,0.18);color:#f87171;}
    .i-xlsx,.i-xls{background:rgba(110,231,183,0.18);color:#6ee7b7;}
    .i-docx,.i-doc{background:rgba(126,184,247,0.18);color:#7eb8f7;}
    .i-pptx,.i-ppt{background:rgba(251,191,36,0.18);color:#fbbf24;}
    .i-img{background:rgba(167,139,250,0.18);color:#a78bfa;}
    .i-mp4,.i-mp3,.i-m4a{background:rgba(251,113,133,0.15);color:#fb7185;}
    .i-other{background:rgba(255,255,255,0.07);color:var(--mu);}
    .cbody{flex:1;min-width:0;}
    .cname{font-size:15px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-bottom:4px;color:var(--tx);}
    .cmeta{font-size:11px;color:var(--mu);display:flex;align-items:center;gap:5px;flex-wrap:wrap;margin-bottom:3px;}
    .cpath{font-size:10px;color:var(--mu);opacity:.6;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
    .ctags{display:flex;gap:4px;flex-wrap:wrap;margin-top:5px;}
    .tp{font-size:10px;padding:2px 6px;border-radius:7px;}
    .tp.g{background:rgba(126,184,247,0.12);color:var(--a);border:1px solid rgba(126,184,247,0.18);}
    .tp.t{background:rgba(167,139,250,0.12);color:var(--a2);border:1px solid rgba(167,139,250,0.18);}
    .tp.c{background:rgba(110,231,183,0.12);color:var(--a3);border:1px solid rgba(110,231,183,0.18);}
    .tp.dup{background:rgba(248,113,113,0.1);color:var(--dg);border:1px solid rgba(248,113,113,0.18);}
    .card-fav-btn{background:none;border:none;font-size:16px;cursor:pointer;padding:2px;flex-shrink:0;opacity:.4;transition:opacity .2s;}
    .card-fav-btn:hover,.card-fav-btn.on{opacity:1;}

    /* EXPANDED */
    .cdet{display:none;margin-top:9px;}
    .card.exp .cdet{display:block;}
    .fullpath{font-size:11px;color:var(--mu);background:var(--s3);border-radius:7px;padding:7px 10px;margin-bottom:7px;word-break:break-all;line-height:1.6;}
    .cacts{display:grid;grid-template-columns:1fr 1fr;gap:5px;margin-bottom:7px;}
    .abtn{padding:8px;border-radius:var(--rsm);border:1px solid var(--gborder);background:var(--gb);color:var(--tx);font-family:var(--font);font-size:12px;font-weight:500;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:4px;transition:all .18s;text-decoration:none;}
    .abtn:hover{background:var(--ghover);}
    .abtn.pr{background:rgba(126,184,247,0.13);border-color:rgba(126,184,247,0.28);color:var(--a);}
    .abtn.cp{color:var(--a3);border-color:rgba(110,231,183,0.28);}

    /* TAG EDITOR */
    .tedit{border-top:1px solid var(--gborder);padding-top:7px;margin-top:3px;}
    .telabel{font-size:10px;text-transform:uppercase;letter-spacing:.08em;color:var(--mu);margin-bottom:5px;}
    .terow{display:flex;gap:5px;}
    .teinput{flex:1;background:var(--gb);border:1px solid var(--gborder);border-radius:7px;padding:6px 9px;color:var(--tx);font-family:var(--font);font-size:12px;outline:none;}
    .teinput:focus{border-color:var(--a3);}
    .teadd{padding:6px 11px;border-radius:7px;border:1px solid rgba(110,231,183,0.28);background:rgba(110,231,183,0.09);color:var(--a3);font-family:var(--font);font-size:12px;cursor:pointer;white-space:nowrap;}
    .ctlist{display:flex;gap:4px;flex-wrap:wrap;margin-top:5px;}
    .ctitem{display:flex;align-items:center;gap:3px;font-size:10px;padding:2px 6px;border-radius:7px;background:rgba(110,231,183,0.12);color:var(--a3);border:1px solid rgba(110,231,183,0.2);}
    .rmtag{background:none;border:none;color:var(--a3);cursor:pointer;font-size:11px;padding:0;opacity:.7;}

    /* STATES */
    .smsg{text-align:center;padding:50px 20px;color:var(--mu);}
    .smsg .big{font-size:36px;margin-bottom:10px;}
    .smsg h3{font-size:16px;font-weight:500;color:var(--tx);margin-bottom:5px;}
    .smsg p{font-size:13px;line-height:1.6;}
    .spin{width:24px;height:24px;border:2px solid var(--gborder);border-top-color:var(--a);border-radius:50%;animation:sp .7s linear infinite;margin:0 auto 12px;}
    @keyframes sp{to{transform:rotate(360deg);}}

    /* MODAL */
    .mover{position:fixed;inset:0;background:rgba(10,12,20,.72);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);z-index:100;display:flex;align-items:flex-end;justify-content:center;opacity:0;pointer-events:none;transition:opacity .25s;}
    .mover.on{opacity:1;pointer-events:all;}
    .msheet{width:100%;max-width:900px;background:var(--s2);border-radius:22px 22px 0 0;border:1px solid var(--gborder);border-bottom:none;padding:16px 18px 36px;transform:translateY(100%);transition:transform .3s cubic-bezier(.32,.72,0,1);max-height:85vh;overflow-y:auto;}
    .mover.on .msheet{transform:translateY(0);}
    .mhandle{width:32px;height:4px;background:var(--gborder);border-radius:2px;margin:0 auto 16px;}
    .mtitle{font-size:16px;font-weight:600;margin-bottom:16px;}
    .sgrp{margin-bottom:14px;}
    .slabel{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--mu);margin-bottom:5px;font-weight:500;}
    .sinput{width:100%;background:var(--gb);border:1px solid var(--gborder);border-radius:var(--rsm);padding:10px 12px;color:var(--tx);font-family:var(--font);font-size:14px;outline:none;transition:border-color .2s;}
    .sinput:focus{border-color:var(--a);}
    .sinput[type="password"]{letter-spacing:.15em;}
    .sbtn{width:100%;padding:12px;border-radius:var(--rsm);border:none;background:linear-gradient(135deg,var(--a),var(--a2));color:#fff;font-family:var(--font);font-size:14px;font-weight:600;cursor:pointer;margin-top:5px;}
    .vinfo{text-align:center;font-size:11px;color:var(--mu);margin-top:12px;}

    mark{background:rgba(126,184,247,0.2);color:var(--a);border-radius:3px;padding:0 2px;}
    .light mark{background:rgba(37,99,235,0.14);}

    @media (min-width:600px) and (orientation:landscape),(min-width:768px){
      .hdr,.srch,.flt,.stats{padding-left:20px;padding-right:20px;}
      .atags{padding-left:20px;padding-right:20px;}
      .res{padding-left:20px;padding-right:20px;}
      .rgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
    }
    @media (min-width:900px){.rgrid{grid-template-columns:1fr 1fr 1fr;}}
  </style>
</head>
<body>
<div id="app">
  <div class="hdr">
    <div class="logo">DF</div>
    <div class="hdr-txt">
      <h1>DocuFran <span class="ver" id="vbadge"></span></h1>
      <p id="hsub">Cargando…</p>
    </div>
    <div class="hdr-acts">
      <button class="ibtn" id="favBtn" onclick="toggleFavFilter()" title="Favoritos">⭐</button>
      <button class="ibtn" id="themeBtn" onclick="toggleTheme()" title="Tema">🌙</button>
      <button class="ibtn" onclick="openSettings()" title="Ajustes">⚙</button>
    </div>
  </div>

  <div class="srch">
    <div class="sbox">
      <span style="color:var(--mu);font-size:16px;flex-shrink:0;">🔍</span>
      <input type="search" id="si" placeholder="ficha omega3, campaña embarazo, contrato 2024…" autocomplete="off" autocorrect="off" spellcheck="false"/>
      <button class="clr" id="clrBtn" onclick="clearSearch()">✕</button>
    </div>
  </div>

  <!-- Active tags bar -->
  <div class="atags" id="atagsBar"></div>

  <!-- Filter groups -->
  <div class="flt">
    <div class="flt-row" id="fgrpRow"></div>
    <div id="fdropArea"></div>
  </div>

  <div class="stats" id="statsBar">Cargando catálogo…</div>

  <div class="res" id="resArea">
    <div id="loadState" class="smsg"><div class="spin"></div><p>Cargando documentos…</p></div>
    <div id="emptyState" class="smsg" style="display:none"><div class="big">📂</div><h3>Empieza a buscar</h3><p>Escribe algo o usa los filtros de arriba</p></div>
    <div id="noRes" class="smsg" style="display:none"><div class="big">🔍</div><h3>Sin resultados</h3><p>Prueba con otras palabras o quita algún filtro</p></div>
    <div class="rgrid" id="rgrid"></div>
  </div>
</div>

<!-- Settings -->
<div class="mover" id="settModal" onclick="closeSettOuts(event)">
  <div class="msheet">
    <div class="mhandle"></div>
    <div class="mtitle">⚙ Configuración</div>
    <div class="sgrp"><div class="slabel">URL de Nextcloud</div><input class="sinput" id="cfgUrl" type="url" placeholder="https://80.38.223.215"/></div>
    <div class="sgrp"><div class="slabel">Usuario</div><input class="sinput" id="cfgUser" type="text" placeholder="Fran.nunez" autocomplete="username"/></div>
    <div class="sgrp"><div class="slabel">Contraseña</div><input class="sinput" id="cfgPass" type="password" placeholder="••••••••" autocomplete="current-password"/></div>
    <div class="sgrp"><div class="slabel">Nombre del CSV</div><input class="sinput" id="cfgCsv" type="text" placeholder="catalogo_archivos.csv"/></div>
    <button class="sbtn" onclick="saveSettings()">Guardar configuración</button>
    <div class="vinfo" id="vinfo"></div>
  </div>
</div>

<script>
const CFG_KEY='dfcfg', CT_KEY='dfctags', FAV_KEY='dffavs', APP_VER='v1.2.1';

// ── FILTER DEFINITIONS ──────────────────────────────────────
const FILTER_GROUPS = [
  {
    id:'producto', label:'📋 Producto', type:'normal',
    chips:[
      {id:'fichas', label:'Fichas', match:{carpetas:['fichas'], tipos:['Ficha']}},
      {id:'fichas_nuevas', label:'Fichas nuevas', match:{carpetas:['fichas nuevas']}},
      {id:'vademecum', label:'Vademecum', match:{carpetas:['vademecum']}},
      {id:'ayuda_visita', label:'Ayuda de visita', match:{carpetas:['fichas/ayuda de visita'], palabras:['ayuda de visita','herramienta visita']}},
      {id:'journals', label:'Journals', match:{tipos:['Journal'], palabras:['journal']}},
      {id:'estudios', label:'Estudios', match:{tipos:['Estudio/Informe'], palabras:['estudio','informe']}},
      {id:'marketing', label:'Marketing', match:{tipos:['Marketing'], carpetas:['nutergia/materiales marketing']}},
      {id:'tutoriales', label:'Tutoriales', match:{carpetas:['tutoriales de nutergia']}},
      {id:'protocolos', label:'Protocolos', match:{palabras:['protocolo']}},
      {id:'oficial', label:'Oficial Nutergia', match:{carpetas:['nutergia']}},
      {id:'presentacion', label:'Presentación', match:{palabras:['presentac'], tipos:['Presentación']}},
    ]
  },
  {
    id:'terapeutico', label:'💊 Terapéutico', type:'therapeutic',
    chips:[
      {id:'intestino', label:'Intestino/Microbiota', match:{carpetas:['intestino'], palabras:['intestino','microbiota','probiot','flora']}},
      {id:'detox', label:'Detox', match:{carpetas:['detoxificacion y limpieza'], palabras:['detox','drenaj','depura']}},
      {id:'mujer', label:'Salud Mujer', match:{carpetas:['femenino'], palabras:['mujer','femenin','embaraz','vaginal']}},
      {id:'embarazo', label:'Embarazo', match:{palabras:['embaraz','gestac','prenatal','maternidad']}},
      {id:'osteo', label:'Osteoarticular', match:{carpetas:['osteoarticular'], palabras:['osteo','articular','hueso','artritis']}},
      {id:'cognitivo', label:'Cognitivo', match:{carpetas:['cognitivo'], palabras:['cognitiv','memoria','concentrac']}},
      {id:'metabolismo', label:'Metabolismo', match:{carpetas:['metabolismo'], palabras:['metabolismo','glucemia','glicemia']}},
      {id:'deporte', label:'Deporte', match:{carpetas:['deporte'], palabras:['deport','sport','ejercicio']}},
      {id:'inmunidad', label:'Inmunidad', match:{carpetas:['inmunidad'], palabras:['inmun','defens','virus']}},
      {id:'estetica', label:'Estética/Antiaging', match:{carpetas:['estetica y antiaging'], palabras:['antiaging','estetica','piel']}},
      {id:'alergenos', label:'Alérgenos', match:{carpetas:['alergenos'], palabras:['alerg']}},
      {id:'iomet', label:'Iomet', match:{carpetas:['iomet','iomet curas','imagenes iomet'], palabras:['iomet']}},
      {id:'pediatria', label:'Pediatría', match:{carpetas:['pediatria'], palabras:['pediatr','niño','infant','bebé']}},
      {id:'acidos', label:'Ácidos Grasos/Omega', match:{carpetas:['acidos grasos'], palabras:['omega','dha','epa','acido graso']}},
      {id:'animo', label:'Ánimo/Estrés', match:{carpetas:['animo estado'], palabras:['animo','estres','ansiedad','depres']}},
      {id:'micoinmune', label:'MicoInmune', match:{carpetas:['micoinmune'], palabras:['mico','hongo']}},
      {id:'nutril', label:'Nutril Gama', match:{carpetas:['nutril gama'], palabras:['nutril']}},
      {id:'elidyn', label:'Elidyn', match:{carpetas:['elidyn 2019'], palabras:['elidyn']}},
      {id:'annaelle', label:'Annaelle', match:{carpetas:['annaelle'], palabras:['annaelle']}},
    ]
  },
  {

// ── CSV PARSE ───────────────────────────────────────────────
function parseCSV(text){
  const lines=text.split('\n').filter(l=>l.trim());
  const docs=[];
  // Detect columns from header
  const rawHeader=lines[0].replace(/^﻿/,'');
  const header=rawHeader.split(';').map(h=>h.toLowerCase().trim().replace(/^"+|"+$/g,''));
  const col=n=>header.indexOf(n.toLowerCase());
  const iNom=col('nombre'),iDesc=col('descripcion'),iEtq=col('etiquetas'),
    iGrp=col('grupo'),iTipo=col('tipo'),
    iCat=col('categoria'),iExt=col('extension'),iFec=col('fecha'),
    iRuta=col('ruta'),iDup=col('duplicado'),iExcl=col('excluir');
  for(let i=1;i<lines.length;i++){
    const p=lines[i].split(';').map(x=>x.replace(/^"|"$/g,'').trim());
    if(p.length<6)continue;
    docs.push({
      nombre:p[iNom]||'',descripcion:p[iDesc]||'',etiquetas:p[iEtq]||'',
      grupo:iGrp>=0?(p[iGrp]||''):'',tipo:iTipo>=0?(p[iTipo]||''):'',
      categoria:p[iCat]||'',extension:(p[iExt]||'').toLowerCase(),
      fecha:p[iFec]||'',ruta:p[iRuta]||'',
      duplicado:iDup>=0?(p[iDup]||''):'',excluir:iExcl>=0?(p[iExcl]||''):''
    });
  }
  return docs;
}

// ── FILTER MATCH ────────────────────────────────────────────
function norm(s){return s.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'');}

function docMatchesChip(doc, chip){
  const m=chip.match;
  const ruta=norm(doc.ruta.replace(/\\/g,'/'));
  const todo=norm([doc.nombre,doc.descripcion,doc.etiquetas,doc.categoria,doc.grupo,doc.tipo,(customTags[dk(doc)]||[]).join(' ')].join(' '));
  if(m.grupos && m.grupos.some(g=>norm(doc.grupo||'').includes(norm(g)))) return true;
  if(m.tipos && m.tipos.some(t=>norm(doc.tipo||'').includes(norm(t)))) return true;
  if(m.carpetas && m.carpetas.some(c=>ruta.startsWith(norm(c))||ruta.includes(norm(c)))) return true;
  if(m.etiquetas && m.etiquetas.some(e=>todo.includes(norm(e)))) return true;
  if(m.palabras && m.palabras.some(p=>todo.includes(norm(p)))) return true;
  return false;
}

// Fix arrow function syntax issue
function docMatchesCarpeta(doc, carpeta){
  const ruta=norm(doc.ruta.replace(/\\/g,'/'));
  return ruta.startsWith(norm(carpeta)) || ruta.includes(norm(carpeta));
}

function docMatchesChipFixed(doc, chip){
  const m=chip.match;
  if(m.noDuplicado) return !doc.duplicado;
  const ruta=norm(doc.ruta.replace(/\\/g,'/'));
  const todo=norm([doc.nombre,doc.descripcion,doc.etiquetas,doc.categoria,doc.grupo,doc.tipo,(customTags[dk(doc)]||[]).join(' ')].join(' '));
  if(m.grupos && m.grupos.some(g=>norm(doc.grupo||'').includes(norm(g)))) return true;
  if(m.tipos && m.tipos.some(t=>norm(doc.tipo||'').includes(norm(t)))) return true;
  if(m.carpetas && m.carpetas.some(c=>docMatchesCarpeta(doc,c))) return true;
  if(m.etiquetas && m.etiquetas.some(e=>todo.includes(norm(e)))) return true;
  if(m.palabras && m.palabras.some(p=>todo.includes(norm(p)))) return true;
  return false;
}

      const el=document.createElement('button');

  });

function toggleChip(chipId, isExcl){
  if(isExcl){

    else activeExcl.add(chipId);
  } else {
    if(activeTags.has(chipId))activeTags.delete(chipId);

}

function findChip(id){

document.getElementById('si').addEventListener('input',function(){searchQ=this.value.trim();document.getElementById('clrBtn').classList.toggle('on',searchQ.length>0);doSearch();});
function clearSearch(){document.getElementById('si').value='';searchQ='';document.getElementById('clrBtn').classList.remove('on');doSearch();}

function expandQ(q){const ws=norm(q).split(/\s+/).filter(Boolean);const exp=new Set(ws);ws.forEach(w=>{(SYN[w]||[]).forEach(s=>exp.add(norm(s)));});return[...exp];}

// Fuzzy match - tolerates 1 character error for words > 4 chars
function fuzzyMatch(hay, needle){
  if(hay.includes(needle))return true;
  if(needle.length<=3)return false;
  // Simple: check if 80% of chars match consecutively
  for(let i=0;i<=hay.length-needle.length+1;i++){
    let diff=0;
    for(let j=0;j<needle.length&&i+j<hay.length;j++){if(hay[i+j]!==needle[j])diff++;}
    if(diff<=1)return true;
  }
  return false;
}

function docText(doc){return norm([doc.nombre,doc.descripcion,doc.etiquetas,doc.categoria,doc.grupo,doc.tipo,doc.ruta,(customTags[dk(doc)]||[]).join(' ')].join(' '));}

function doSearch(){
  const words=searchQ?expandQ(searchQ):[];

  let filtered=allDocs.filter(doc=>{
    // Favorites filter
    if(favOnly&&!favs.has(dk(doc)))return false;
    // Exclusion filters
    for(const exId of activeExcl){
      const chip=findChip(exId);
      if(chip&&docMatchesChipFixed(doc,chip))return false;
    }
    // Inclusion filters (OR within same group, AND across groups)
    if(activeTags.size>0){
      // Group active tags by group
      const byGroup={};
      activeTags.forEach(id=>{
        const g=FILTER_GROUPS.find(g=>g.chips.some(c=>c.id===id));
        if(g){if(!byGroup[g.id])byGroup[g.id]=[];byGroup[g.id].push(id);}
      });
      // Must match at least one chip from each active group
      for(const gid of Object.keys(byGroup)){
        const chips=byGroup[gid];
        const matchesAny=chips.some(id=>{const chip=findChip(id);return chip&&docMatchesChipFixed(doc,chip);});
        if(!matchesAny)return false;
      }
    }
    // Text search
    if(words.length>0){
      const hay=docText(doc);
      return words.some(w=>fuzzyMatch(hay,w));
    }
    return true;
  });

  renderResults(filtered);
}

function hl(text,q){if(!q)return esc(text);const ws=norm(q).split(/\s+/).filter(Boolean);let r=esc(text);ws.forEach(w=>{const rx=new RegExp('('+w.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+')','gi');r=r.replace(rx,'<mark>$1</mark>');});return r;}

  }).join('');
  if(filtered.length>150)grid.innerHTML+=`<div style="text-align:center;padding:14px;color:var(--mu);font-size:12px;grid-column:1/-1">Mostrando 150 de ${filtered.length}. Afina la búsqueda.</div>`;
}

function toggleCard(idx,e){if(e&&e.target.closest('.abtn,.teinput,.teadd,.rmtag,.card-fav-btn'))return;const c=document.getElementById(`cd_${idx}`);if(!c)return;const was=c.classList.contains('exp');document.querySelectorAll('.card.exp').forEach(x=>x.classList.remove('exp'));if(!was)c.classList.add('exp');}
function toggleFav(e,key,idx){e.stopPropagation();const rKey=key.replace(/\\'/g,"'").replace(/\\\\/g,'\\');if(favs.has(rKey))favs.delete(rKey);else favs.add(rKey);saveFavs();const c=document.getElementById(`cd_${idx}`);if(c){const isFav=favs.has(rKey);c.classList.toggle('faved',isFav);const btn=c.querySelector('.card-fav-btn');if(btn){btn.classList.toggle('on',isFav);btn.textContent=isFav?'⭐':'☆';btn.title=isFav?'Quitar favorito':'Añadir favorito';}}if(favOnly)doSearch();}
function addTag(e,idx,key){e.stopPropagation();const input=document.getElementById(`ti_${idx}`);const tag=input.value.trim();if(!tag)return;const rKey=key.replace(/\\'/g,"'").replace(/\\\\/g,'\\');if(!customTags[rKey])customTags[rKey]=[];if(!customTags[rKey].includes(tag)){customTags[rKey].push(tag);saveCT();}input.value='';refreshCTL(idx,rKey);}
function rmTag(e,idx,key,tag){e.stopPropagation();const rKey=key.replace(/\\'/g,"'").replace(/\\\\/g,'\\');if(customTags[rKey])customTags[rKey]=customTags[rKey].filter(t=>t!==tag);saveCT();refreshCTL(idx,rKey);}
function refreshCTL(idx,key){const list=document.getElementById(`ctl_${idx}`);if(!list)return;const tags=customTags[key]||[];const safeKey=key.replace(/\\/g,'\\\\').replace(/'/g,"\\'");list.innerHTML=tags.map(t=>`<span class="ctitem">${esc(t)}<button class="rmtag" onclick="rmTag(event,${idx},'${safeKey}','${esc(t)}')">✕</button></span>`).join('');}
function copyLink(e,url,btn){e.stopPropagation();navigator.clipboard.writeText(url).then(()=>{const o=btn.textContent;btn.textContent='✓ Copiado';btn.classList.add('cp');setTimeout(()=>{btn.textContent=o;btn.classList.remove('cp');},2000);});}
function showEmpty(){document.getElementById('emptyState').style.display='block';document.getElementById('noRes').style.display='none';document.getElementById('rgrid').innerHTML='';document.getElementById('rgrid').style.display='none';document.getElementById('statsBar').innerHTML=allDocs.length?`<span>${allDocs.length.toLocaleString()}</span> documentos indexados`:'';}

// ── INIT ────────────────────────────────────────────────────
const st=localStorage.getItem('dftheme');
if(st==='light'){isDark=false;document.body.classList.add('light');document.getElementById('themeBtn').textContent='☀️';}
loadData();
</script>
<script>if('serviceWorker' in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js'));</script>
